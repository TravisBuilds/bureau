version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bureau_test
    ports:
      - "5433:5432"
    volumes:
      - ./supabase/dev:/docker-entrypoint-initdb.d/00-dev
      - ./supabase/migrations:/docker-entrypoint-initdb.d/01-migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
